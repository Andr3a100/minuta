[project]
name = "minuta"
version = "0.1.0"
description = "Minuta: l'assistente supervisionato di uno studio legale"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minuta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
