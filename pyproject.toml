[project]
name = "minuta"
version = "0.1.0"
description = "Minuta: l'assistente supervisionato di uno studio legale"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minuta", "app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# Il codice stampato nel libro sta in 79 colonne.
line-length = 79
target-version = "py313"
